<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar Energy Ad Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
  h1 { text-align: center; margin: 20px 0 8px; color: #FFB800; font-size: 28px; }
  p.sub { text-align: center; color: #aaa; margin-bottom: 24px; }
  .controls { text-align: center; margin-bottom: 30px; }
  .controls button {
    background: #FFB800; color: #000; border: none; padding: 14px 36px;
    font-size: 18px; font-weight: 700; border-radius: 8px; cursor: pointer;
    margin: 6px; transition: transform 0.1s;
  }
  .controls button:hover { transform: scale(1.04); }
  .controls button.secondary {
    background: #222; color: #FFB800; border: 1px solid #FFB800; font-size: 14px; padding: 10px 22px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
  .ad-card { background: #1a1a1a; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
  .ad-card h3 { padding: 10px 14px; font-size: 13px; color: #999; border-bottom: 1px solid #333; }
  .ad-card canvas { display: block; width: 100%; height: auto; }
  .ad-card .dl-btn {
    display: block; width: calc(100% - 20px); margin: 10px; padding: 8px;
    background: #222; color: #FFB800; border: 1px solid #444; border-radius: 5px;
    cursor: pointer; font-size: 12px; text-align: center;
  }
  .ad-card .dl-btn:hover { background: #2a2a2a; }
  #status { text-align: center; margin: 10px; color: #4CAF50; font-weight: bold; font-size: 16px; min-height: 24px; }
</style>
</head>
<body>
<h1>☀️ Solar Energy Ad Generator</h1>
<p class="sub">20 sales-focused photo ads — click to download all as PNG files</p>
<div class="controls">
  <button onclick="downloadAll()">⬇ Download All 20 PNGs</button>
  <button class="secondary" onclick="renderAll()">↺ Re-render Previews</button>
</div>
<div id="status"></div>
<div class="grid" id="grid"></div>

  // --- SQUARE 1080x1080 ---
  {

// ─── HELPER DRAWING FUNCTIONS ─────────────────────────────────────────────────

function drawText(ctx, text, x, y, maxWidth, size, color, weight, align) {
  ctx.save();
  ctx.font = `${weight} ${size}px 'Segoe UI', Arial, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y, maxWidth);
  ctx.restore();
}

function roundedRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawRoundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.save();
  roundedRectPath(ctx, x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();
}

function drawBadge(ctx, cx, cy, w, h, bg, fg, text, size) {
  drawRoundRect(ctx, cx - w/2, cy - h/2, w, h, h/2, bg);
  drawText(ctx, text, cx, cy, w - 20, size, fg, 'bold', 'center');
}

function drawPill(ctx, cx, cy, w, h, bg, fg, text, size) {
  drawRoundRect(ctx, cx - w/2, cy - h/2, w, h, h/2, bg);
  drawText(ctx, text, cx, cy, w - 20, size, fg, '600', 'center');
}

function drawSunGlow(ctx, cx, cy, r, innerColor, outerColor) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, innerColor);
  g.addColorStop(0.5, outerColor);
  g.addColorStop(1, 'transparent');
  ctx.save();
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSunRays(ctx, cx, cy, r1, r2, count, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSunIcon(ctx, cx, cy, r) {
  ctx.save();
  // Rays
  ctx.strokeStyle = '#FFD700'; ctx.lineWidth = r * 0.08;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r * 1.2, cy + Math.sin(a) * r * 1.2);
    ctx.lineTo(cx + Math.cos(a) * r * 1.6, cy + Math.sin(a) * r * 1.6);
    ctx.stroke();
  }
  // Circle
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawHouseWithPanels(ctx, cx, cy, width, height, color) {
  ctx.save();
  ctx.fillStyle = color;
  const x = cx - width/2, y = cy - height/2;
  // Body
  ctx.fillRect(x + width*0.15, y + height*0.4, width*0.7, height*0.6);
  // Roof
  ctx.beginPath();
  ctx.moveTo(x, y + height*0.42);
  ctx.lineTo(cx, y);
  ctx.lineTo(x + width, y + height*0.42);
  ctx.closePath();
  ctx.fill();

  // Panels on roof (gold)
  ctx.save();
  ctx.translate(cx, y + height*0.2);
  ctx.rotate(-0.38);
  const pw = width * 0.08, ph = width * 0.06;
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 4; col++) {
      const px = (col - 1.5) * (pw + 4);
      const py = row * (ph + 4) - ph/2;
      ctx.fillStyle = '#1a3a6e';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 1;
      ctx.strokeRect(px, py, pw, ph);
      ctx.beginPath();
      ctx.moveTo(px + pw/2, py);
      ctx.lineTo(px + pw/2, py + ph);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px, py + ph/2);
      ctx.lineTo(px + pw, py + ph/2);
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.restore();
}

function drawPanelArray(ctx, x, y, w, h, rows, cols) {
  ctx.save();
  const padX = w * 0.02, padY = h * 0.04;
  const cellW = (w - padX * (cols + 1)) / cols;
  const cellH = (h - padY * (rows + 1)) / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const px = x + padX + c * (cellW + padX);
      const py = y + padY + r * (cellH + padY);
      // Panel bg
      ctx.fillStyle = '#0d2a5c';
      roundedRectPath(ctx, px, py, cellW, cellH, 4);
      ctx.fill();
      // Grid lines
      ctx.strokeStyle = 'rgba(100,180,255,0.4)';
      ctx.lineWidth = 1;
      for (let cx2 = 1; cx2 < 4; cx2++) {
        ctx.beginPath();
        ctx.moveTo(px + cellW * cx2 / 4, py);
        ctx.lineTo(px + cellW * cx2 / 4, py + cellH);
        ctx.stroke();
      }
      for (let cy2 = 1; cy2 < 3; cy2++) {
        ctx.beginPath();
        ctx.moveTo(px, py + cellH * cy2 / 3);
        ctx.lineTo(px + cellW, py + cellH * cy2 / 3);
        ctx.stroke();
      }
      // Shine
      const shine = ctx.createLinearGradient(px, py, px + cellW, py + cellH);
      shine.addColorStop(0, 'rgba(255,255,255,0.08)');
      shine.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = shine;
      roundedRectPath(ctx, px, py, cellW, cellH, 4);
      ctx.fill();
      // Outline
      ctx.strokeStyle = 'rgba(100,180,255,0.6)';
      ctx.lineWidth = 1;
      roundedRectPath(ctx, px, py, cellW, cellH, 4);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSleekPanels(ctx, x, y, w, h) {
  drawPanelArray(ctx, x, y, w, h, 2, 6);
}

function drawEarth(ctx, cx, cy, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, 0, cx, cy, r);
  g.addColorStop(0, '#4facde'); g.addColorStop(0.5, '#0066aa'); g.addColorStop(1, '#003366');
  ctx.fillStyle = g; ctx.fill();
  // Land masses
  ctx.fillStyle = '#22c55e';
  [[cx - r*0.3, cy - r*0.2, r*0.28], [cx + r*0.2, cy + r*0.1, r*0.22], [cx - r*0.1, cy + r*0.35, r*0.15]].forEach(([ex, ey, er]) => {
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill();
  });
  // Outline
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawROIGauge(ctx, cx, cy, r) {
  ctx.save();
  // Background arc
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 20;
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
  // Fill arc (75%)
  const g = ctx.createLinearGradient(cx - r, cy, cx + r, cy);
  g.addColorStop(0, '#22c55e'); g.addColorStop(1, '#FFD700');
  ctx.strokeStyle = g; ctx.lineWidth = 20;
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 0.75 + Math.PI * 1.5 * 0.75); ctx.stroke();
  drawText(ctx, 'ROI', cx, cy - 20, 200, 40, '#FFFFFF', 'bold', 'center');
  drawText(ctx, '75%', cx, cy + 30, 200, 52, '#4ADE80', '900', 'center');
  ctx.restore();
}

function drawBolt(ctx, cx, cy, w, h, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 40;
  ctx.beginPath();
  ctx.moveTo(cx + w * 0.3, cy - h * 0.5);
  ctx.lineTo(cx - w * 0.1, cy);
  ctx.lineTo(cx + w * 0.2, cy);
  ctx.lineTo(cx - w * 0.3, cy + h * 0.5);
  ctx.lineTo(cx + w * 0.1, cy);
  ctx.lineTo(cx - w * 0.2, cy);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawClouds(ctx, w, h) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  [[w*0.15, h*0.12, 90], [w*0.7, h*0.08, 70], [w*0.45, h*0.18, 60]].forEach(([x, y, r]) => {
    [-r, 0, r].forEach(dx => {
      ctx.beginPath(); ctx.arc(x + dx, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
    });
  });
  ctx.restore();
}

function drawStars(ctx, w, h, count) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (let i = 0; i < count; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = Math.random() * 2 + 0.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawNeighborhood(ctx, w, h) {
  ctx.save();
  const houseCount = 5;
  const houseW = w / houseCount;
  for (let i = 0; i < houseCount; i++) {
    const hx = i * houseW + houseW * 0.1;
    const hy = h * 0.45;
    const hw = houseW * 0.8;
    const hh = h * 0.45;
    // House body
    ctx.fillStyle = ['#e8d5b7', '#d4c4a8', '#c8b89a', '#ddd0b8', '#e0d0bc'][i];
    ctx.fillRect(hx + hw * 0.1, hy + hh * 0.35, hw * 0.8, hh * 0.65);
    // Roof
    ctx.fillStyle = ['#8B4513', '#6b3410', '#7a3d14', '#964816', '#5c2e0d'][i];
    ctx.beginPath();
    ctx.moveTo(hx, hy + hh * 0.37);
    ctx.lineTo(hx + hw/2, hy);
    ctx.lineTo(hx + hw, hy + hh * 0.37);
    ctx.closePath(); ctx.fill();
    // Solar panels (gold)
    ctx.fillStyle = '#1a3a6e';
    for (let p = 0; p < 3; p++) {
      const px = hx + hw*0.2 + p * (hw*0.2);
      ctx.fillRect(px, hy + hh*0.08, hw*0.15, hw*0.1);
      ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 1; ctx.strokeRect(px, hy + hh*0.08, hw*0.15, hw*0.1);
    }
    // Window
    ctx.fillStyle = 'rgba(135,206,235,0.7)';
    ctx.fillRect(hx + hw*0.35, hy + hh*0.5, hw*0.3, hw*0.25);
    // Door
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(hx + hw*0.4, hy + hh*0.75, hw*0.2, hw*0.25);
  }
  ctx.restore();
}

// ─── RENDER & DOWNLOAD ────────────────────────────────────────────────────────

function renderAd(ad) {
  const canvas = document.getElementById(`canvas-${ad.id}`);
  canvas.width = ad.w;
  canvas.height = ad.h;
  const ctx = canvas.getContext('2d');
  ad.render(ctx, ad.w, ad.h);
  return canvas;
}

function renderAll() {
  ads.forEach(ad => renderAd(ad));
}

function downloadCanvas(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function downloadAll() {
  const btn = document.querySelector('.controls button');
  btn.textContent = '⏳ Downloading...';
  btn.disabled = true;
  document.getElementById('status').textContent = 'Starting downloads...';
  for (let i = 0; i < ads.length; i++) {
    const ad = ads[i];
    const canvas = document.getElementById(`canvas-${ad.id}`);
    document.getElementById('status').textContent = `Downloading ad ${i+1} of ${ads.length}: ${ad.name}...`;
    downloadCanvas(canvas, `solar-ad-${String(ad.id).padStart(2,'0')}-${ad.name.replace(/[^a-z0-9]/gi,'-').toLowerCase()}.png`);
    await new Promise(r => setTimeout(r, 400));
  }
  document.getElementById('status').textContent = `✅ All ${ads.length} ads downloaded!`;
  btn.textContent = '⬇ Download All 20 PNGs';
  btn.disabled = false;
}

// ─── BUILD GRID ────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('grid');
  ads.forEach(ad => {
    const card = document.createElement('div');
    card.className = 'ad-card';
    card.innerHTML = `
      <h3>Ad #${ad.id} — ${ad.name} (${ad.w}×${ad.h})</h3>
      <canvas id="canvas-${ad.id}"></canvas>
      <button class="dl-btn" onclick="downloadCanvas(document.getElementById('canvas-${ad.id}'), 'solar-ad-${ad.id}.png')">⬇ Download this ad</button>
    `;
    grid.appendChild(card);
  });
  renderAll();
});
